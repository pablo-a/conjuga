name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Permet de republier sans nouveau commit, après un changement de réglage Pages.
  workflow_dispatch:

# Groupé par référence, jamais globalement : deux pull requests doivent pouvoir
# être vérifiées en même temps. Seul un nouveau push sur la *même* branche rend
# la vérification précédente caduque.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # Le déploiement dépend de `check` : rien n'est publié qui n'ait passé la suite
  # complète. C'est la raison pour laquelle les deux vivent dans le même workflow
  # — `needs` ne traverse pas les fichiers.
  build-pages:
    needs: check
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          # Le site est servi sous https://<compte>.github.io/<dépôt>/. Sans cette
          # base, les assets, le manifeste et le service worker pointeraient vers
          # la racine du domaine et la page resterait blanche.
          # Déduit du dépôt plutôt qu'écrit en dur : un renommage suit tout seul.
          VITE_BASE: /${{ github.event.repository.name }}/
      # Les trois actions Pages sont montées ensemble : à leurs versions
      # précédentes elles tournaient toutes sur Node 20, que les runners GitHub
      # ne fournissent plus et forcent déjà sur Node 24. Seule celle-ci était
      # signalée — parce qu'elle expose `upload-artifact` — mais les deux autres
      # arrivaient à la même échéance sans le dire.
      - uses: actions/upload-pages-artifact@v5
        with:
          path: dist

  deploy-pages:
    needs: build-pages
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    # GitHub n'accepte qu'un déploiement Pages à la fois. On ne l'interrompt pas
    # en cours de route : une publication à moitié faite serait pire que tardive.
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
      - id: deployment
        uses: actions/deploy-pages@v5
